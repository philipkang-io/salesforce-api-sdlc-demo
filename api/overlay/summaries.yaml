# OpenAPI Overlay 1.0: our fixes on top of the spec Salesforce generates.
#
# Salesforce's generator leaves every operation without a summary, which
# Postman governance reports as 9 errors. The fixes live here, not in
# api/source/openapi.json, so regenerating the spec never wipes them.
overlay: 1.0.0
info:
  title: Summaries, descriptions and tags for the Salesforce sObjects API
  version: 1.0.0
actions:
  - target: $.paths['/sobjects/{sObject}'].get
    update:
      summary: Get object metadata
      description: Returns basic metadata for an object, plus its most recently used records.
      tags: [Object metadata]
  - target: $.paths['/sobjects/{sObject}/describe'].get
    update:
      summary: Describe an object
      description: Returns every field, relationship and setting of an object, including custom fields.
      tags: [Object metadata]
  - target: $.paths['/sobjects/{sObject}'].post
    update:
      summary: Create a record
      description: Creates a record of the given object and returns its ID.
      tags: [Records]
  - target: $.paths['/sobjects/{sObject}/{id}'].get
    update:
      summary: Get a record
      description: Returns a record by ID. Use the fields parameter to return only the fields you need.
      tags: [Records]
  - target: $.paths['/sobjects/{sObject}/{id}'].patch
    update:
      summary: Update a record
      description: Updates the given fields of a record. Fields left out of the request are not changed. Success returns 204 No Content with an empty body; use Get a record to see the change.
      tags: [Records]
  - target: $.paths['/sobjects/{sObject}/{id}'].delete
    update:
      summary: Delete a record
      description: Deletes a record by ID. Deleted records go to the Recycle Bin. Success returns 204 No Content with an empty body.
      tags: [Records]
  - target: $.paths['/sobjects/{sObject}/{id}/{blobField}'].get
    update:
      summary: Get a file field
      description: Returns the binary content of a file field, such as an attachment body.
      tags: [Records]
  - target: $.paths['/sobjects/{sObject}/updated'].get
    update:
      summary: List updated records
      description: Returns the IDs of records updated between the start and end times. Use it to sync changes.
      tags: [Change tracking]
  - target: $.paths['/sobjects/{sObject}/deleted'].get
    update:
      summary: List deleted records
      description: Returns the IDs of records deleted between the start and end times. Use it to sync deletions.
      tags: [Change tracking]
  # Fern API Explorer ("Try it"): pre-fill the object with Loyalty_Member__c
  # (Fern's explorer uses the example first, then x-fern-default) and tell people
  # where the token comes from.
  - target: $.paths['/sobjects/{sObject}'].get.parameters[?(@.name=='sObject')]
    update:
      x-fern-default: Loyalty_Member__c
      example: Loyalty_Member__c
  - target: $.paths['/sobjects/{sObject}'].post.parameters[?(@.name=='sObject')]
    update:
      x-fern-default: Loyalty_Member__c
      example: Loyalty_Member__c
  - target: $.paths['/sobjects/{sObject}/deleted'].get.parameters[?(@.name=='sObject')]
    update:
      x-fern-default: Loyalty_Member__c
      example: Loyalty_Member__c
  - target: $.paths['/sobjects/{sObject}/describe'].get.parameters[?(@.name=='sObject')]
    update:
      x-fern-default: Loyalty_Member__c
      example: Loyalty_Member__c
  - target: $.paths['/sobjects/{sObject}/updated'].get.parameters[?(@.name=='sObject')]
    update:
      x-fern-default: Loyalty_Member__c
      example: Loyalty_Member__c
  - target: $.paths['/sobjects/{sObject}/{id}'].delete.parameters[?(@.name=='sObject')]
    update:
      x-fern-default: Loyalty_Member__c
      example: Loyalty_Member__c
  - target: $.paths['/sobjects/{sObject}/{id}'].get.parameters[?(@.name=='sObject')]
    update:
      x-fern-default: Loyalty_Member__c
      example: Loyalty_Member__c
  - target: $.paths['/sobjects/{sObject}/{id}'].patch.parameters[?(@.name=='sObject')]
    update:
      x-fern-default: Loyalty_Member__c
      example: Loyalty_Member__c
  - target: $.paths['/sobjects/{sObject}/{id}/{blobField}'].get.parameters[?(@.name=='sObject')]
    update:
      x-fern-default: Loyalty_Member__c
      example: Loyalty_Member__c
  - target: $.components.securitySchemes.bearerAuth
    update:
      x-fern-playground-description: Paste an access token from the External Client App's client credentials flow (see the Quickstart). The demo presenter uses `make token-copy`, which copies a fresh token to the clipboard.
  # Try it examples for the remaining operations. Demo members in the org:
  # Ada Lovelace (M-1001, read-only, also used by the Agentforce agent) and
  # Grace Hopper (M-1002, the one to update).
  - target: $.paths['/sobjects/{sObject}/{id}'].get.parameters[?(@.name=='id')]
    update:
      example: a00fj00002l1vwEAAQ
      description: The record ID. The example is Ada Lovelace (M-1001), a demo member.
  - target: $.paths['/sobjects/{sObject}/{id}'].get.parameters[?(@.name=='fields')]
    update:
      example: Name,Member_Number__c,Tier__c,Points_Balance__c,Enrolled_On__c
  - target: $.paths['/sobjects/{sObject}/{id}'].patch.parameters[?(@.name=='id')]
    update:
      example: a00fj00002l1yIzAAI
      description: The record ID. The example is Grace Hopper (M-1002), a demo member you can update.
  # Put a Loyalty Member example first (Try it uses the first one); keep
  # Salesforce's Account and Contact examples after it.
  - target: $.paths['/sobjects/{sObject}/{id}'].patch.requestBody.content['application/json'].examples
    remove: true
  - target: $.paths['/sobjects/{sObject}/{id}'].patch.requestBody.content['application/json']
    update:
      examples:
        Loyalty_Member__c:
          summary: Loyalty Member Example
          value:
            Tier__c: Gold
            Points_Balance__c: 12000
        Account:
          summary: Account Example
          value:
            Name: Test Account
            apiSObjectType: Account
        Contact:
          summary: Contact Example
          value:
            FirstName: Some
            LastName: Name
            apiSObjectType: Contact
  - target: $.paths['/sobjects/{sObject}/{id}'].delete.parameters[?(@.name=='id')]
    update:
      example: PASTE-ID-FROM-CREATE
      description: The record ID. To try it, run Create a record first and paste the id it returns.
  # Put a Loyalty Member example first (Try it uses the first one); keep
  # Salesforce's Account and Contact examples after it.
  - target: $.paths['/sobjects/{sObject}'].post.requestBody.content['application/json'].examples
    remove: true
  - target: $.paths['/sobjects/{sObject}'].post.requestBody.content['application/json']
    update:
      examples:
        Loyalty_Member__c:
          summary: Loyalty Member Example
          value:
            Name: SDLC-Demo-TryIt
            Tier__c: Silver
            Points_Balance__c: 500
            Enrolled_On__c: '2026-11-18'
        Account:
          summary: Account Example
          value:
            Name: Test Account
            apiSObjectType: Account
        Contact:
          summary: Contact Example
          value:
            FirstName: Some
            LastName: Name
            apiSObjectType: Contact
  - target: $.paths['/sobjects/{sObject}/updated'].get.parameters[?(@.name=='start')]
    update:
      example: '2026-11-01T00:00:00Z'
  - target: $.paths['/sobjects/{sObject}/updated'].get.parameters[?(@.name=='end')]
    update:
      example: '2026-11-18T23:59:00Z'
  - target: $.paths['/sobjects/{sObject}/deleted'].get.parameters[?(@.name=='start')]
    update:
      example: '2026-11-01T00:00:00Z'
  - target: $.paths['/sobjects/{sObject}/deleted'].get.parameters[?(@.name=='end')]
    update:
      example: '2026-11-18T23:59:00Z'
  # Loyalty_Member__c has no file field, so Try it cannot succeed here.
  - target: $.paths['/sobjects/{sObject}/{id}/{blobField}'].get
    update:
      x-fern-explorer: false
