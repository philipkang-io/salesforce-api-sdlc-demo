name: Publish docs

# Republishes the Fern docs site after a merge to main that changes the spec
# or the docs, so the API reference always matches the merged spec.
#
# Needs the repository secret FERN_TOKEN: an organization token for the
# philip-v12 Fern organization from `fern org token create` (not `fern token`).

on:
  push:
    branches: [main]
    paths:
      - api/openapi.yaml
      - fern/**
      - .github/workflows/docs-publish.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20

      - name: Install Fern CLI
        run: npm install --global fern-api@5.195.0

      - name: Check the docs
        working-directory: fern
        run: fern check

      - name: Publish the docs site
        working-directory: fern
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
        run: |
          if [ -z "$FERN_TOKEN" ]; then
            echo "::error::FERN_TOKEN is not set (repository secret)"
            exit 1
          fi
          fern generate --docs --no-prompt
